<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caspar Schols — Studio</title>
  <link rel="icon" href="assets/fotos/logo.png" type="image/png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      cursor: default;
    }

    /* ── Stage ── */
    #stage {
      position: fixed;
      inset: 0;
    }

    /* ── Slides ── */
    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.8s ease;
      overflow: hidden;
    }
    .slide.active {
      opacity: 1;
    }
    .slide img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transform: scale(1);
    }
    /* ── Overlay ── */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.15);
      pointer-events: none;
      z-index: 10;
    }

    /* ── Logo ── */
    #logo {
      position: fixed;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      pointer-events: none;
    }

    #logo img {
      width: clamp(80px, 14vw, 160px);
      mix-blend-mode: multiply;
      display: block;
    }

    @keyframes fadeHint {
      to { opacity: 0.8; }
    }
  </style>
</head>
<body>

  <div id="stage"></div>
  <div id="overlay"></div>
  <div id="logo">
    <img src="assets/fotos/logo.png" alt="Caspar Schols">
  </div>

  <script>
    var IMAGES = [
      "assets/fotos/4ed9d59a-7508-4175-aa67-891ecf470535.jpg",
      "assets/fotos/Cabin-ANNA-Vermont-13.jpeg",
      "assets/fotos/Cabin-ANNA-Vermont-20.jpeg",
      "assets/fotos/Cabin-ANNA-Vermont-23.jpeg",
      "assets/fotos/Cabin-ANNA-Vermont-8.jpeg",
      "assets/fotos/DJI_0204.jpeg",
      "assets/fotos/DJI_0420.jpeg",
      "assets/fotos/DSC05168.JPG",
      "assets/fotos/DSCF6006.jpg",
      "assets/fotos/DSCF6138.jpg",
      "assets/fotos/DSCF6788.jpeg",
      "assets/fotos/DSCF6806.jpeg",
      "assets/fotos/DSCF8482.jpeg",
      "assets/fotos/IMG_0189.JPG",
      "assets/fotos/IMG_0194.JPG",
      "assets/fotos/IMG_0200.JPG",
      "assets/fotos/IMG_0233.PNG",
      "assets/fotos/IMG_0248.PNG",
      "assets/fotos/IMG_0276.PNG",
      "assets/fotos/IMG_3065.PNG",
      "assets/fotos/IMG_5107.JPG",
      "assets/fotos/IMG_5123.JPG",
      "assets/fotos/IMG_5134.JPG",
      "assets/fotos/IMG_5139.JPG",
      "assets/fotos/IMG_5146.JPG",
      "assets/fotos/IMG_5181.jpg",
      "assets/fotos/IMG_5188_1.jpg",
      "assets/fotos/IMG_7436.JPG",
      "assets/fotos/IMG_7439.JPG",
      "assets/fotos/IMG_7484.JPG",
      "assets/fotos/IMG_9393.JPG",
      "assets/fotos/In use_1.jpeg",
      "assets/fotos/Jorrit3.jpeg",
      "assets/fotos/_DSF0119.jpeg",
      "assets/fotos/_DSF0165.jpeg",
      "assets/fotos/_DSF4846.jpeg",
      "assets/fotos/_MG_6544.jpeg",
      "assets/fotos/_TTZ5643.jpeg"
    ];

    /* Fisher-Yates shuffle for variety on each visit */
    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    }
    IMAGES = shuffle(IMAGES);

    var stage   = document.getElementById('stage');
    var current = 0;
    var slides  = [];
    var timer   = null;

    /* Build DOM for every slide (img loads lazily except first 3) */
    IMAGES.forEach(function(src, i) {
      var slide = document.createElement('div');
      slide.className = 'slide';

      var img = document.createElement('img');
      img.alt = '';
      if (i < 3) {
        img.src = src;               /* eager — preload first 3 */
      } else {
        img.loading = 'lazy';
        img.dataset.src = src;       /* lazy — swap in when needed */
      }

      slide.appendChild(img);
      stage.appendChild(slide);
      slides.push(slide);
    });

    function loadAhead(index) {
      /* Ensure the next few slides have their src set */
      for (var k = 1; k <= 3; k++) {
        var idx = (index + k) % slides.length;
        var img = slides[idx].querySelector('img');
        if (img.dataset.src) {
          img.src = img.dataset.src;
          delete img.dataset.src;
        }
      }
    }

    function goTo(index) {
      slides[current].classList.remove('active');
      current = (index + slides.length) % slides.length;
      slides[current].classList.add('active');
      loadAhead(current);
    }

    function startTimer() {
      timer = setInterval(function() {
        goTo(current + 1);
      }, 3000);
    }

    /* Initial display */
    slides[0].classList.add('active');
    loadAhead(0);
    startTimer();

    /* Navigate to site on any click or touch */
    function enter(e) {
      e.preventDefault();
      clearInterval(timer);
      window.location.href = 'home.html';
    }
    document.addEventListener('click', enter);
    document.addEventListener('touchend', enter, { passive: false });
  </script>

</body>
</html>
