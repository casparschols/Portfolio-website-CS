  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      cursor: default;
    }

    /* ── Stage ── */
    #stage {
      position: fixed;
      inset: 0;
    }

    /* ── Slides ── */
    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.8s ease;
      overflow: hidden;
    }
    .slide.active {
      opacity: 1;
    }
    .slide img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transform: scale(1);
    }
    /* ── Overlay ── */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.15);
      pointer-events: none;
      z-index: 10;
    }


    @keyframes fadeHint {
      to { opacity: 0.8; }
    }
  </style>
</head>

    /* Fisher-Yates shuffle for variety on each visit */
    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    }
    IMAGES = shuffle(IMAGES);

    var stage   = document.getElementById('stage');
    var current = 0;
    var slides  = [];
    var timer   = null;

    /* Build DOM for every slide (img loads lazily except first 3) */
    IMAGES.forEach(function(src, i) {
      var slide = document.createElement('div');
      slide.className = 'slide';

      var img = document.createElement('img');
      img.alt = '';
      if (i < 3) {
        img.src = src;               /* eager — preload first 3 */
      } else {
        img.loading = 'lazy';
        img.dataset.src = src;       /* lazy — swap in when needed */
      }

      slide.appendChild(img);
      stage.appendChild(slide);
      slides.push(slide);
    });

    function loadAhead(index) {
      /* Ensure the next few slides have their src set */
      for (var k = 1; k <= 3; k++) {
        var idx = (index + k) % slides.length;
        var img = slides[idx].querySelector('img');
        if (img.dataset.src) {
          img.src = img.dataset.src;
          delete img.dataset.src;
        }
      }
    }

    function goTo(index) {
      slides[current].classList.remove('active');
      current = (index + slides.length) % slides.length;
      slides[current].classList.add('active');
      loadAhead(current);
    }

    function startTimer() {
      timer = setInterval(function() {
        goTo(current + 1);
      }, 3000);
    }

    /* Initial display */
    slides[0].classList.add('active');
    loadAhead(0);
    startTimer();

    /* Navigate to site on any click or touch */
    function enter(e) {
      e.preventDefault();
      clearInterval(timer);
      window.location.href = 'home.html';
    }
    document.addEventListener('click', enter);
    document.addEventListener('touchend', enter, { passive: false });
